env:
  scene:
    model_file: ""
    default_keyframe_name: home
    entities: {}
  sim_dt: 0.001
  ctrl_dt: 0.02
  max_episode_seconds: 20.0
  seed: 1
  observations:
    policy:
      enable_corruption: true
      terms:
        base_ang_vel:
          func: m1_unilab.full_mdp.RootKinematics
          params: {kind: ang_vel}
          scale: 0.25
          clip: [-100, 100]
          noise: {_target_: unilab.managers.UniformNoiseCfg, n_min: -0.2, n_max: 0.2}
        projected_gravity:
          func: m1_unilab.full_mdp.RootKinematics
          params: {kind: gravity}
          clip: [-100, 100]
          noise: {_target_: unilab.managers.UniformNoiseCfg, n_min: -0.05, n_max: 0.05}
        command: &command_obs
          func: unilab.envs.mdp.generated_commands
          params: {command_name: twist}
          clip: [-100, 100]
        joint_pos:
          func: m1_unilab.full_mdp.joint_pos_without_wheels
          clip: [-100, 100]
          noise: {_target_: unilab.managers.UniformNoiseCfg, n_min: -0.01, n_max: 0.01}
        joint_vel:
          func: unilab.envs.mdp.joint_vel_rel
          scale: 0.05
          clip: [-100, 100]
          noise: {_target_: unilab.managers.UniformNoiseCfg, n_min: -1.5, n_max: 1.5}
        previous_action: &action_obs
          func: unilab.envs.mdp.last_action
          clip: [-100, 100]
    critic:
      enable_corruption: false
      terms:
        base_lin_vel:
          func: m1_unilab.full_mdp.RootKinematics
          params: {kind: lin_vel}
          clip: [-100, 100]
        base_ang_vel:
          func: m1_unilab.full_mdp.RootKinematics
          params: {kind: ang_vel}
          clip: [-100, 100]
        projected_gravity:
          func: m1_unilab.full_mdp.RootKinematics
          params: {kind: gravity}
          clip: [-100, 100]
        command: *command_obs
        joint_pos:
          func: m1_unilab.full_mdp.joint_pos_without_wheels
          clip: [-100, 100]
        joint_vel:
          func: unilab.envs.mdp.joint_vel_rel
          clip: [-100, 100]
        previous_action: *action_obs
        height_scan:
          func: m1_unilab.mdp.HeightScan
          clip: [-1, 1]
  actions:
    drive:
      _target_: m1_unilab.full_drive.FullDriveCfg
      entity_name: robot
      delay_min_steps: 0
      delay_max_steps: 20
      gain_scale_range: [0.5, 2.0]
      force_range: [-30.0, 30.0]
      torque_range: [-10.0, 10.0]
      leg_abduction_scale: 0.125
      leg_flexion_scale: 0.25
      wheel_scale: 5.0
      target_clip: 100.0
  commands:
    twist:
      _target_: m1_unilab.full_mdp.ThresholdVelocityCommandCfg
      entity_name: robot
      resampling_time_range: [10.0, 10.0]
      heading_command: true
      heading_control_stiffness: 0.5
      rel_heading_envs: 1.0
      rel_standing_envs: 0.02
      ranges:
        lin_vel_x: [-1.0, 1.0]
        lin_vel_y: [-1.0, 1.0]
        ang_vel_z: [-1.0, 1.0]
        heading: [-3.141592653589793, 3.141592653589793]
  events:
    materials:
      func: m1_unilab.full_events.MaterialBuckets
      mode: startup
      params:
        asset_cfg: &robot
          _target_: unilab.managers.scene_entity_config.SceneEntityCfg
          name: robot
        num_buckets: 64
        friction_range: [0.3, 1.0]
        restitution_range: [0.0, 0.5]
        time_constant: 0.02
    mass_inertia:
      func: m1_unilab.full_events.BodyMassInertia
      mode: startup
      params:
        asset_cfg: *robot
        base_body_name: BASE_LINK
        base_mass_range: [-1.0, 3.0]
        other_mass_scale_range: [0.7, 1.3]
    com:
      func: unilab.envs.mdp.randomize_rigid_body_com
      mode: startup
      params:
        asset_cfg:
          _target_: unilab.managers.scene_entity_config.SceneEntityCfg
          name: robot
          body_names: [BASE_LINK]
        com_range: {x: [-0.05, 0.05], y: [-0.05, 0.05], z: [-0.05, 0.05]}
    default:
      func: unilab.envs.mdp.reset_scene_to_default
      mode: reset
    root:
      func: unilab.envs.mdp.reset_root_state_uniform
      mode: reset
      params:
        pose_range:
          x: [-0.5, 0.5]
          y: [-0.5, 0.5]
          z: [0.0, 0.2]
          roll: [-3.14, 3.14]
          pitch: [-3.14, 3.14]
          yaw: [-3.14, 3.14]
        velocity_range:
          x: [-0.5, 0.5]
          y: [-0.5, 0.5]
          z: [-0.5, 0.5]
          roll: [-0.5, 0.5]
          pitch: [-0.5, 0.5]
          yaw: [-0.5, 0.5]
    terrain_clearance:
      func: m1_unilab.full_reset.TerrainClearance
      mode: reset
      params: {clearance: 0.005}
    drive:
      func: m1_unilab.full_events.RandomizeDrive
      mode: reset
    push:
      func: unilab.envs.mdp.push_by_setting_velocity
      mode: interval
      interval_range_s: [10.0, 15.0]
      params:
        velocity_range: {x: [-0.5, 0.5], y: [-0.5, 0.5]}
  terminations:
    time_out:
      func: unilab.envs.mdp.time_out
      time_out: true
    terrain_bounds:
      func: m1_unilab.full_mdp.TerrainBounds
      time_out: true
  policy_observation_group: policy
  critic_observation_group: critic
reward:
  lin_vel_z_l2: {func: m1_unilab.full_rewards.B2WReward, weight: -2.0, params: {kind: lin_vel_z_l2}}
  ang_vel_xy_l2: {func: m1_unilab.full_rewards.B2WReward, weight: -0.05, params: {kind: ang_vel_xy_l2}}
  joint_torques_l2: {func: m1_unilab.full_rewards.B2WReward, weight: -0.00001, params: {kind: joint_torques_l2}}
  joint_acc_l2: {func: m1_unilab.full_rewards.B2WReward, weight: -0.0000001, params: {kind: joint_acc_l2}}
  joint_acc_wheel_l2: {func: m1_unilab.full_rewards.B2WReward, weight: -0.00000000025, params: {kind: joint_acc_wheel_l2}}
  joint_pos_limits: {func: m1_unilab.full_rewards.B2WReward, weight: -5.0, params: {kind: joint_pos_limits}}
  joint_power: {func: m1_unilab.full_rewards.B2WReward, weight: -0.00001, params: {kind: joint_power}}
  stand_still: {func: m1_unilab.full_rewards.B2WReward, weight: -2.0, params: {kind: stand_still}}
  joint_pos_penalty: {func: m1_unilab.full_rewards.B2WReward, weight: -1.0, params: {kind: joint_pos_penalty}}
  joint_mirror: {func: m1_unilab.full_rewards.B2WReward, weight: -0.05, params: {kind: joint_mirror}}
  action_rate_l2: {func: m1_unilab.full_rewards.B2WReward, weight: -0.01, params: {kind: action_rate_l2}}
  undesired_contacts: {func: m1_unilab.full_rewards.B2WReward, weight: -1.0, params: {kind: undesired_contacts}}
  contact_forces: {func: m1_unilab.full_rewards.B2WReward, weight: -0.00015, params: {kind: contact_forces}}
  track_lin_vel_xy_exp: {func: m1_unilab.full_rewards.B2WReward, weight: 3.0, params: {kind: track_lin_vel_xy_exp}}
  track_ang_vel_z_exp: {func: m1_unilab.full_rewards.B2WReward, weight: 1.5, params: {kind: track_ang_vel_z_exp}}
  feet_contact_without_cmd: {func: m1_unilab.full_rewards.B2WReward, weight: 0.1, params: {kind: feet_contact_without_cmd}}
  upward: {func: m1_unilab.full_rewards.B2WReward, weight: 3.0, params: {kind: upward}}
algo:
  num_envs: 512
  num_steps_per_env: 24
  max_iterations: 30000
  save_interval: 100
  experiment_name: m1_b2w_full
  obs_groups: {actor: [actor], critic: [critic]}
  actor:
    hidden_dims: [512, 256, 128]
    activation: elu
    obs_normalization: false
    distribution_cfg: {init_std: 1.0}
  critic:
    hidden_dims: [512, 256, 128]
    activation: elu
    obs_normalization: false
  algorithm:
    learning_rate: 0.001
    schedule: adaptive
    desired_kl: 0.01
    entropy_coef: 0.01
    num_learning_epochs: 5
    num_mini_batches: 4
    clip_param: 0.2
    gamma: 0.99
    lam: 0.95
    max_grad_norm: 1.0
    value_loss_coef: 1.0
    use_clipped_value_loss: true
training:
  task_name: M1MixedFull
  sim_backend: mujoco
  device: mps
  collector_tensor_device: cpu
  no_play: true
  defer_finite_validation: false
  nan_guard: {defer_validation: false, check_interval: 1}
  logger: tensorboard
  log_interval: 5
